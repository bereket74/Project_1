[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-intelligence"
version = "0.1.0"
description = "RSS-first news collection, transparent NLP analysis, and related-story grouping"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "feedparser>=6.0.12,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "vaderSentiment>=3.3.2,<4",
  "gradio>=4.44,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
ner = ["spacy>=3.7,<4"]
semantic = ["sentence-transformers==6.2.0", "sentencepiece==0.2.1"]
zerogpu = ["spaces==0.51.3", "sentence-transformers==6.2.0", "sentencepiece==0.2.1"]

[project.scripts]
newsintel = "newsintel.cli:main"

[tool.setuptools.packages.find]
include = ["newsintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
